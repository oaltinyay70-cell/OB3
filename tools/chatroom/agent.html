<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Agent Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #0d1321;
            --border: #1e293b;
            --border-glow: #334155;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .agent-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .agent-title {
            font-weight: 700;
            font-size: 16px;
        }

        .agent-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 1px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .back-link:hover {
            border-color: var(--border-glow);
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 4px #10b981;
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 12px #10b981;
            }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg {
            display: flex;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .msg:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .msg-body {
            flex: 1;
            min-width: 0;
        }

        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 3px;
        }

        .msg-agent {
            font-weight: 600;
            font-size: 13px;
        }

        .msg-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
        }

        .msg-content {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 14px;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 14px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .msg-input {
            flex: 1;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 10px 16px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .msg-input:focus {
            border-color: var(--agent-color, #06b6d4);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .msg-input::placeholder {
            color: var(--text-dim);
        }

        .btn-send {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            background: var(--agent-color, #06b6d4);
            color: var(--bg-primary);
        }

        .btn-send:hover {
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="agent-icon" id="agentIcon"></div>
            <div>
                <div class="agent-title" id="agentTitle"></div>
                <div class="agent-role" id="agentRole"></div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-dot"></div>
            <a href="/" class="back-link">← GENERAL</a>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="msg-empty" id="emptyState">No messages yet — start the conversation</div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" class="msg-input" placeholder="Talk to this agent..." />
        <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const AGENTS = {
            'DILEK': { color: '#06b6d4', emoji: '🎯', bg: 'rgba(6,182,212,0.12)', role: 'ORCHESTRATOR — Pipeline coordination & quality gates' },
            'OB3-ProjectManager': { color: '#f59e0b', emoji: '📋', bg: 'rgba(245,158,11,0.12)', role: 'BUSINESS ANALYST — Functional specs & task breakdown' },
            'OB3-UXArchitect': { color: '#8b5cf6', emoji: '🏗️', bg: 'rgba(139,92,246,0.12)', role: 'UX ARCHITECT — Game flow & screen architecture' },
            'OB3-UIDesigner': { color: '#ec4899', emoji: '🎨', bg: 'rgba(236,72,153,0.12)', role: 'UI DESIGNER — Visual design system & components' },
            'OB3-SeniorDev': { color: '#3b82f6', emoji: '💻', bg: 'rgba(59,130,246,0.12)', role: 'SENIOR DEV — Core engine & business logic' },
            'OB3-MobileBuilder': { color: '#10b981', emoji: '📱', bg: 'rgba(16,185,129,0.12)', role: 'MOBILE BUILDER — iOS platform & deployment' },
            'OB3-QA': { color: '#ef4444', emoji: '🧪', bg: 'rgba(239,68,68,0.12)', role: 'QA — Evidence collection & validation' },
            'OB3-TechWriter': { color: '#f97316', emoji: '✍️', bg: 'rgba(249,115,22,0.12)', role: 'TECH WRITER — Documentation & architecture docs' },
        };

        // Get agent name from URL path: /agent/AGENT_NAME
        const pathParts = window.location.pathname.split('/');
        const AGENT_NAME = decodeURIComponent(pathParts[pathParts.length - 1]);
        const agentInfo = AGENTS[AGENT_NAME] || { color: '#94a3b8', emoji: '👤', bg: 'rgba(148,163,184,0.12)', role: 'AGENT' };

        // Set page info
        document.title = `OB3 — ${AGENT_NAME}`;
        document.getElementById('pageTitle').textContent = `OB3 — ${AGENT_NAME}`;
        document.getElementById('agentIcon').textContent = agentInfo.emoji;
        document.getElementById('agentIcon').style.background = agentInfo.bg;
        document.getElementById('agentIcon').style.color = agentInfo.color;
        document.getElementById('agentTitle').textContent = AGENT_NAME;
        document.getElementById('agentTitle').style.color = agentInfo.color;
        document.getElementById('agentRole').textContent = agentInfo.role;
        document.getElementById('msgInput').placeholder = `Talk to ${AGENT_NAME}...`;
        document.documentElement.style.setProperty('--agent-color', agentInfo.color);
        document.querySelector('.btn-send').style.background = agentInfo.color;

        let lastId = 0;
        let hasMessages = false;

        async function pollMessages() {
            try {
                const res = await fetch(`/api/messages?since=${lastId}`);
                const msgs = await res.json();
                const relevant = msgs.filter(m =>
                    m.agent === AGENT_NAME || m.to === AGENT_NAME ||
                    (m.agent === 'COMMANDER' && m.to === AGENT_NAME)
                );
                if (relevant.length > 0) {
                    if (!hasMessages) {
                        document.getElementById('emptyState').style.display = 'none';
                        hasMessages = true;
                    }
                    relevant.forEach(renderMsg);
                    scrollToBottom();
                }
                if (msgs.length > 0) lastId = msgs[msgs.length - 1].id;
            } catch (e) { console.error('Poll error:', e); }
        }

        function renderMsg(msg) {
            const container = document.getElementById('messages');
            const isCommander = msg.agent === 'COMMANDER';
            const info = isCommander
                ? { color: '#facc15', emoji: '👤', bg: 'rgba(250,204,21,0.12)' }
                : agentInfo;
            const time = new Date(msg.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `
        <div class="msg-avatar" style="background:${info.bg};color:${info.color}">${info.emoji}</div>
        <div class="msg-body">
          <div class="msg-header">
            <span class="msg-agent" style="color:${info.color}">${isCommander ? 'COMMANDER (You)' : msg.agent}</span>
            <span class="msg-time">${time}</span>
          </div>
          <div class="msg-content">${escapeHTML(msg.content)}</div>
        </div>`;
            container.appendChild(div);
        }

        function escapeHTML(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function scrollToBottom() {
            const el = document.getElementById('messages');
            el.scrollTop = el.scrollHeight;
        }

        async function sendMessage() {
            const content = document.getElementById('msgInput').value.trim();
            if (!content) return;
            try {
                await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent: 'COMMANDER', content, type: 'message', to: AGENT_NAME }),
                });
                document.getElementById('msgInput').value = '';
            } catch (e) { console.error('Send error:', e); }
        }

        document.getElementById('msgInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        pollMessages();
        setInterval(pollMessages, 1500);
    </script>
</body>

</html>
